name: probe-espn
on:
  push:
    branches: [probe-espn]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe-espn }
      - name: Fetch NHL clips
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'}), timeout=30) as r: return json.load(r)
          os.makedirs('probe', exist_ok=True)
          out={}
          try:
              base='https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/'
              sb=get(base+'scoreboard?dates=20261108')
              ev=[e for e in sb['events'] if any(c['team']['abbreviation']=='BOS' for c in e['competitions'][0]['competitors'])][0]
              s=get(base+'summary?event='+ev['id'])
              out['espn_keys']=list(s.keys()); out['espn_videos']=s.get('videos')
              out['espn_sb_videos']=[c.get('highlights') for c in ev['competitions']]
          except Exception as e: out['espn_err']=str(e)
          try:
              sc=get('https://api-web.nhle.com/v1/score/2026-11-08')
              g=[x for x in sc['games'] if 'BOS' in (x['awayTeam']['abbrev'],x['homeTeam']['abbrev'])][0]
              out['nhl_score_game']=g
              out['nhl_landing']=get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/landing")
          except Exception as e: out['nhl_err']=str(e)
          json.dump(out, open('probe/nhl_clips.json','w'))
          print('ok')
          PY
      - name: Commit
        run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add probe && git commit -qm "probe nhl clips" && git push -q origin HEAD:probe-espn
