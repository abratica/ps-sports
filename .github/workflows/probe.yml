name: probe-espn
on:
  push:
    branches: [probe-espn]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe-espn }
      - name: Fetch NHL clips
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          H={'User-Agent':'Mozilla/5.0'}
          def raw(u,extra=None):
              with urllib.request.urlopen(urllib.request.Request(u, headers={**H,**(extra or {})}), timeout=30) as r: return r.read(), r.headers
          def get(u): return json.loads(raw(u)[0])
          os.makedirs('probe/th', exist_ok=True)
          base='https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/'
          sb=get(base+'scoreboard?dates=20261108'); json.dump(sb, open('probe/sb_nhl_20261108.json','w'))
          ev=[e for e in sb['events'] if any(c['team']['abbreviation']=='BOS' for c in e['competitions'][0]['competitors'])][0]
          s=get(base+'summary?event='+ev['id']); json.dump(s, open('probe/sum_nhl_20261108.json','w'))
          rep=[]
          for i,v in enumerate(s.get('videos',[])):
              try:
                  b,_=raw(v['thumbnail']); open(f'probe/th/{v["id"]}.jpg','wb').write(b)
              except Exception as e: rep.append(('thumb',v['id'],str(e)))
          v=s['videos'][0]; mp4=v['links']['source']['href']
          for ref in (None,'https://abratica.github.io/'):
              try:
                  b,h=raw(mp4,{'Range':'bytes=0-1023',**({'Referer':ref} if ref else {})}); rep.append(('mp4',ref,h.get('Content-Type'),h.get('Content-Range'),h.get('Access-Control-Allow-Origin')))
              except Exception as e: rep.append(('mp4',ref,str(e)))
          json.dump(rep, open('probe/report.json','w')); print(rep)
          PY
      - name: Commit
        run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add probe && git commit -qm "probe nhl clips 2" && git push -q origin HEAD:probe-espn
